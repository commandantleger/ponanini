<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PONAN'S LEGACY</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- ========================================= -->
    <!-- MENU PRINCIPAL -->
    <!-- ========================================= -->

    <div id="menu">

        <div class="menu-overlay"></div>

        <div class="menu-content">

            <div class="menu-logo">

                <div class="logo-duck">
                    🦆
                </div>

                <h1>
                    PONAN'S LEGACY
                </h1>

                <h2>
                    L'Héritage des Plumes
                </h2>

                <div class="logo-line"></div>

            </div>


            <!-- ============================= -->
            <!-- BOUTONS -->
            <!-- ============================= -->

            <div class="menu-buttons">

                <button id="playButton">
                    <span>▶</span>
                    NOUVELLE PARTIE
                </button>

                <button id="continueButton">
                    <span>▶</span>
                    CONTINUER
                </button>

                <button id="optionsButton">
                    <span>⚙</span>
                    OPTIONS
                </button>

                <button id="creditsButton">
                    <span>★</span>
                    CRÉDITS
                </button>

                <button id="quitButton">
                    <span>✕</span>
                    QUITTER
                </button>

            </div>


            <!-- ============================= -->
            <!-- TEXTE -->
            <!-- ============================= -->

            <div class="menu-story">

                <p>
                    Un royaume.
                </p>

                <p>
                    Une trahison.
                </p>

                <p>
                    Trois fragments.
                </p>

                <p>
                    Un héritage oublié.
                </p>

            </div>


            <div class="menu-version">
                PONAN'S LEGACY
            </div>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- ÉCRAN DE CHARGEMENT -->
    <!-- ========================================= -->

    <div id="loadingScreen"
         class="hidden">

        <div class="loading-content">

            <div class="loading-title">
                PONAN'S LEGACY
            </div>

            <div class="loading-text">
                Préparation du royaume...
            </div>

            <div class="loading-bar">

                <div id="loadingProgress"></div>

            </div>

            <div class="loading-tip">
                « Certaines histoires sont écrites par les vainqueurs. »
            </div>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- JEU -->
    <!-- ========================================= -->

    <canvas id="game"></canvas>


    <!-- ========================================= -->
    <!-- HUD -->
    <!-- ========================================= -->

    <div id="hud">

        <div id="life">
            ❤️❤️❤️❤️❤️
        </div>

        <div id="quest">
            📜 Trouver Ponanini IV
        </div>

        <div id="pieces">
            🦆 0 / 3
        </div>

    </div>


    <!-- ========================================= -->
    <!-- DIALOGUE -->
    <!-- ========================================= -->

    <div id="dialogue"
         class="hidden">

        <p id="dialogueText"></p>

        <span>
            Appuie sur E
        </span>

    </div>


    <!-- ========================================= -->
    <!-- INVENTAIRE -->
    <!-- ========================================= -->

    <div id="inventory"
         class="hidden">

        <h2>
            Inventaire
        </h2>

        <ul id="inventoryList"></ul>

    </div>


    <!-- ========================================= -->
    <!-- SCRIPTS -->
    <!-- ========================================= -->

    <script src="prologue.js"></script>

    <script src="game.js"></script>


    <!-- ========================================= -->
    <!-- MENU CONTROLLER -->
    <!-- ========================================= -->

<script>

    const menu =
        document.getElementById("menu");

    const playButton =
        document.getElementById("playButton");

    const continueButton =
        document.getElementById("continueButton");

    const optionsButton =
        document.getElementById("optionsButton");

    const creditsButton =
        document.getElementById("creditsButton");

    const quitButton =
        document.getElementById("quitButton");

    const loadingScreen =
        document.getElementById("loadingScreen");

    const loadingProgress =
        document.getElementById("loadingProgress");

    const loadingText =
        document.querySelector(".loading-text");


    /* ==========================================
       NOUVELLE PARTIE
    ========================================== */

    playButton.addEventListener("click", () => {

        console.log("NOUVELLE PARTIE");

        playButton.disabled = true;

        menu.classList.add("menu-hide");

        loadingScreen.classList.remove("hidden");

        startLoading();

    });


    /* ==========================================
       CHARGEMENT
    ========================================== */

    function startLoading() {

        let progress = 0;

        const messages = [

            "Préparation du royaume...",

            "Chargement des terres de Ponan...",

            "Les anciennes légendes se réveillent...",

            "Préparation de la destinée...",

            "L'histoire va commencer..."

        ];


        const interval = setInterval(() => {

            progress += 2;

            if (progress > 100)
                progress = 100;


            loadingProgress.style.width =
                progress + "%";


            const index =
                Math.min(
                    Math.floor(progress / 20),
                    messages.length - 1
                );


            loadingText.textContent =
                messages[index];


            if (progress >= 100) {

                clearInterval(interval);

                waitForEngine();

            }

        }, 50);

    }


    /* ==========================================
       ATTENDRE QUE GAME.JS SOIT PRÊT
    ========================================== */

    function waitForEngine() {

        loadingText.textContent =
            "Le royaume vous attend...";


        const check =
            setInterval(() => {

                if (
                    typeof Game !== "undefined" &&
                    Game.ready === true
                ) {

                    clearInterval(check);

                    setTimeout(() => {

                        loadingScreen.classList.add(
                            "hidden"
                        );

                        launchGame();

                    }, 500);

                }

            }, 100);

    }


    /* ==========================================
       LANCEMENT
    ========================================== */

    function launchGame() {

        console.log(
            "Lancement de la nouvelle partie..."
        );


        if (
            typeof startGame === "function"
        ) {

            startGame();

        } else {

            console.error(
                "ERREUR : startGame() introuvable."
            );

        }

    }


    /* ==========================================
       CONTINUER
    ========================================== */

    continueButton.addEventListener(
        "click",
        () => {

            const save =
                localStorage.getItem(
                    "ponan_save"
                );


            if (!save) {

                alert(
                    "Aucune partie sauvegardée."
                );

                return;

            }


            /*
             * Pour le moment, on lancera
             * le même flux que Nouvelle Partie.
             */

            playButton.click();

        }
    );


    /* ==========================================
       OPTIONS
    ========================================== */

    optionsButton.addEventListener(
        "click",
        () => {

            alert(
                "OPTIONS\n\n" +
                "Les options seront disponibles prochainement."
            );

        }
    );


    /* ==========================================
       CRÉDITS
    ========================================== */

    creditsButton.addEventListener(
        "click",
        () => {

            alert(
                "PONAN'S LEGACY\n\n" +
                "Un RPG créé avec JavaScript + Canvas.\n\n" +
                "Merci d'avoir joué."
            );

        }
    );


    /* ==========================================
       QUITTER
    ========================================== */

    quitButton.addEventListener(
        "click",
        () => {

            window.close();

        }
    );

</script>
