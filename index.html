<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PONAN'S LEGACY</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= MENU ================= -->

    <div id="menu">

        <h1>🦆 PONAN'S LEGACY</h1>

        <h2>Le Royaume des Canards</h2>

        <button id="playButton">
            ▶ JOUER
        </button>

        <p class="credits">
            Trouvez les 3 objets du costume.<br>
            Réparez le portail.<br>
            Traversez la forêt.<br>
            Vainquez le Seigneur Démon.
        </p>

    </div>

    <!-- ================= JEU ================= -->

    <canvas id="game"></canvas>

    <!-- ================= HUD ================= -->

    <div id="hud">

        <div id="life">
            ❤️❤️❤️❤️❤️
        </div>

        <div id="quest">
            📜 Trouver Ponanini IV
        </div>

        <div id="pieces">
            🦆 0 / 3
        </div>

    </div>

    <!-- ================= DIALOGUE ================= -->

    <div id="dialogue" class="hidden">

        <p id="dialogueText"></p>

        <span>Appuie sur E</span>

    </div>

    <!-- ================= INVENTAIRE ================= -->

    <div id="inventory" class="hidden">

        <h2>Inventaire</h2>

        <ul id="inventoryList"></ul>

    </div>

    <!-- ================= JEU ================= -->

    <script src="game.js"></script>

    <script>

        document.getElementById("playButton").addEventListener("click", () => {

            document.getElementById("menu").style.display = "none";

            if (window.Game)
                Game.running = true;

        });

    </script>

</body>

</html>
