<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PONAN'S LEGACY</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= MENU ================= -->

    <div id="menu">

        <h1>🦆 PONAN'S LEGACY</h1>

        <h2>L'Héritage des Plumes</h2>

        <button id="playButton">
            ▶ NOUVELLE PARTIE
        </button>

        <button id="continueButton">
            ▶ CONTINUER
        </button>

        <button id="optionsButton">
            ⚙ OPTIONS
        </button>

        <button id="creditsButton">
            ★ CRÉDITS
        </button>

        <button id="quitButton">
            ✕ QUITTER
        </button>

        <p class="credits">
            Un royaume.<br>
            Une trahison.<br>
            Un héritage oublié.
        </p>

    </div>


    <!-- ================= JEU ================= -->

    <canvas id="game"></canvas>


    <!-- ================= HUD ================= -->

    <div id="hud">

        <div id="life">
            ❤️❤️❤️❤️❤️
        </div>

        <div id="quest">
            📜 Trouver Ponanini IV
        </div>

        <div id="pieces">
            🦆 0 / 3
        </div>

    </div>


    <!-- ================= DIALOGUE ================= -->

    <div id="dialogue" class="hidden">

        <p id="dialogueText"></p>

        <span>Appuie sur E</span>

    </div>


    <!-- ================= INVENTAIRE ================= -->

    <div id="inventory" class="hidden">

        <h2>Inventaire</h2>

        <ul id="inventoryList"></ul>

    </div>


    <!-- ================= SCRIPTS ================= -->

    <!-- La prologue est chargée AVANT le moteur -->
    <script src="prologue.js"></script>

    <!-- Le moteur charge ensuite le reste -->
    <script src="game.js"></script>


    <!-- ================= MENU ================= -->

    <script>

        const playButton =
            document.getElementById("playButton");

        playButton.addEventListener("click", () => {

            if (typeof startGame === "function") {

                startGame();

            } else {

                console.error(
                    "startGame() n'existe pas."
                );

            }

        });

    </script>

</body>

</html>
